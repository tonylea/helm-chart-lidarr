suite: Deployment
release:
  name: lidarr
templates:
  - templates/deployment.yaml
values:
  - ../ci/kind-values.yaml
tests:
  - it: runs one replica of the chart's appVersion, stopping the old pod first
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.containers[0].image
          value: lscr.io/linuxserver/lidarr:3.1.6.5079-ls49

  - it: uses the image tag when one is set
    set:
      image.tag: 3.1.5.5050-ls48
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: lscr.io/linuxserver/lidarr:3.1.5.5050-ls48

  - it: leaves the chart's version off the pod, so a chart-only release doesn't restart it
    chart:
      version: 9.9.9
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: lidarr
            app.kubernetes.io/instance: lidarr
            app.kubernetes.io/version: 3.1.6.5079-ls49

  - it: starts as root with the default seccomp profile, and no service links or API token
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: passes the user, group, timezone and Lidarr's settings
    set:
      puid: 1026
      pgid: 100
      timezone: Europe/Berlin
      postgres.port: 5433
      postgres.databases.main: music
      postgres.databases.log: music-log
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: PUID
              value: "1026"
            - name: PGID
              value: "100"
            - name: TZ
              value: Europe/Berlin
            - name: LIDARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: lidarr-api-key
                  key: api-key
            - name: LIDARR__AUTH__REQUIRED
              value: Enabled
            - name: LIDARR__POSTGRES__HOST
              value: postgres
            - name: LIDARR__POSTGRES__PORT
              value: "5433"
            - name: LIDARR__POSTGRES__MAINDB
              value: music
            - name: LIDARR__POSTGRES__LOGDB
              value: music-log
            - name: LIDARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: username
            - name: LIDARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password

  - it: defaults the user, group, timezone and databases
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUID
            value: "1000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGID
            value: "1000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TZ
            value: UTC
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIDARR__POSTGRES__PORT
            value: "5432"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIDARR__POSTGRES__MAINDB
            value: lidarr-main
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LIDARR__POSTGRES__LOGDB
            value: lidarr-log

  - it: fails without the API key's Secret
    set:
      apiKey.secretKeyRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: apiKey.secretKeyRef.name is required

  - it: fails without the Postgres host
    set:
      postgres.host: ""
    asserts:
      - failedTemplate:
          errorMessage: postgres.host is required

  - it: fails without the Postgres password's Secret
    set:
      postgres.password.secretKeyRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: postgres.password.secretKeyRef.name is required

  - it: probes /ping, giving start-up 5 minutes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /ping
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ping

  - it: leaves resources to whoever deploys it
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value: {}

  - it: uses the resources when set
    set:
      resources.requests.cpu: 100m
      resources.requests.memory: 384Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 100m
              memory: 384Mi

  - it: mounts /config, and each data mount at /data/<name>, from the chart's claims
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /config
            - name: data-downloads
              mountPath: /data/downloads
            - name: data-music
              mountPath: /data/music
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: config
              persistentVolumeClaim:
                claimName: lidarr-config
            - name: data-downloads
              persistentVolumeClaim:
                claimName: lidarr-data-downloads
            - name: data-music
              persistentVolumeClaim:
                claimName: lidarr-data-music

  - it: mounts existing claims when given
    set:
      persistence.config.existingClaim: my-config
      persistence.data:
        - name: downloads
          existingClaim: my-downloads
        - name: music-1
          existingClaim: my-music-1
        - name: music-2
          existingClaim: my-music-2
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: config
              persistentVolumeClaim:
                claimName: my-config
            - name: data-downloads
              persistentVolumeClaim:
                claimName: my-downloads
            - name: data-music-1
              persistentVolumeClaim:
                claimName: my-music-1
            - name: data-music-2
              persistentVolumeClaim:
                claimName: my-music-2

  - it: fails without a data mount
    set:
      persistence.data: []
    asserts:
      - failedTemplate:
          errorMessage: persistence.data needs at least one mount

  - it: fails when a data mount has no name
    set:
      persistence.data:
        - existingClaim: my-data
    asserts:
      - failedTemplate:
          errorMessage: each persistence.data mount needs a name
